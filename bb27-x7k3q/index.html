<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Big Bend + Santa Fe, NYE 2026–27</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#262624;--muted:#73726c;--line:#e8e5db;--soft:#f1efe8;--accent:#185FA5;--red:#A32D2D}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--card:#252523;--ink:#ecebe4;--muted:#a3a198;--line:#34332f;--soft:#2c2c29;--accent:#85B7EB;--red:#F09595}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:2000;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:.8rem;margin:0 0 12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:16px 14px 64px}
section{margin:0 0 28px}
.card{background:var(--card);border-radius:14px;padding:14px 16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.85rem}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--soft);border:1px solid transparent;border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:64px}
button{background:var(--soft);border:0;border-radius:10px;padding:9px 14px;min-height:42px;cursor:pointer}
button.primary{background:var(--accent);color:#fff}
button.link{background:none;padding:4px 0;min-height:0;color:var(--muted);font-size:.85rem;text-decoration:underline}
.who{display:flex;align-items:center;gap:8px;margin-top:8px}
.who label{white-space:nowrap}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.who{margin:0!important}
.day.edit{cursor:pointer}
.day.edit:active{background:var(--soft)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{min-height:32px;padding:4px 10px;font-size:.8rem;border-radius:999px;background:var(--card)}
.tab.on{background:var(--accent);color:#fff}
.dpanel select,.dpanel input,.dpanel textarea{background:var(--card)}
.idea{font-size:.85rem;border:1.5px dashed var(--line);border-radius:10px;padding:6px 10px;margin-top:6px}
.idea .vote{margin-top:4px}
.dpanel{cursor:default;margin-top:10px;background:var(--soft);border-radius:12px;padding:10px}
.who select{width:auto;min-height:36px;padding:6px 10px}
.status{font-size:.75rem;color:var(--muted);margin-left:auto;text-align:right}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.mapbox{position:relative;isolation:isolate;border-radius:14px;overflow:hidden}
#map{height:340px}
.mapbtn{position:absolute;right:10px;bottom:10px;z-index:1000;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2);font-size:.85rem;min-height:36px;padding:6px 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.85rem}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.day{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.date{font-weight:600;font-size:.95rem;line-height:1.25}
.date small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.grp{margin:0 0 8px}
.grp:last-child{margin:0}
.place{font-weight:500}
.drive{color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font-size:.75rem;border-radius:999px;padding:1px 9px;color:#fff}
.hard{color:var(--red);font-size:.85rem;font-weight:500;margin-bottom:6px}
.propline{font-size:.85rem;border:1.5px dashed var(--line);border-radius:10px;padding:4px 10px;margin-top:6px}
.note{font-size:.8rem;color:var(--muted)}
details{background:var(--card);border-radius:14px;margin:0 0 10px}
summary{padding:14px 16px;cursor:pointer;font-weight:500;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted)}
details[open] summary::after{content:"–"}
.dbody{padding:0 16px 16px}
.stop{background:var(--soft);border-radius:12px;padding:12px;margin:0 0 10px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stop input,.stop select,.stop textarea{min-width:0}
.stop .full{grid-column:1 / -1}
.stop select,.stop input{background:var(--card)}
label.l{font-size:.75rem;color:var(--muted);display:block;margin-bottom:2px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.ttl{font-weight:500}
.tag{font-size:.7rem;border:1.5px dashed var(--muted);border-radius:999px;padding:0 8px;margin-left:6px;color:var(--muted);vertical-align:1px}
.acts{display:flex;gap:14px;align-items:center;margin-top:6px}
.vote{background:var(--soft);min-height:32px;padding:3px 12px;font-size:.85rem;border-radius:999px}
.vote.on{background:var(--accent);color:#fff}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hd:first-child{border-top:0}
.pickhint{background:#E6F1FB;color:#0C447C;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9rem}
@media (prefers-color-scheme:dark){.pickhint{background:#042C53;color:#B5D4F4}}
.hide{display:none!important}
.foot{font-size:.8rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <h1>Big Bend + Santa Fe · NYE 2026–27</h1>
  <div id="status" class="status" style="margin-top:4px;text-align:left"></div>
</header>
<main>
  <section>
    <div class="mapbox">
      <div id="map" role="region" aria-label="Map of everyone's routes"></div>
      <button class="mapbtn hide" id="mapMove">Move map</button>
    </div>
    <div id="pickhint" class="pickhint hide">Tap the map to place this stop. <button class="link" id="pickcancel">Cancel</button></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <div class="hrow">
      <h2 style="margin:0">Day by day</h2>
      <div class="who"><label for="who" class="muted">I am a</label><select id="who"><option value="">choose…</option></select></div>
    </div>
    <div class="card" id="days"></div>
  </section>

  <section>
    <h2>Whole plan</h2>
    <details id="planDetails">
      <summary id="planTitle">Edit our plan</summary>
      <div class="dbody">
        <p id="planNeedWho" class="muted">Choose your family next to Day by day first.</p>
        <div id="planEditor" class="hide">
          <div id="stops"></div>
          <div class="row" style="margin-bottom:10px">
            <button id="addStop">+ Add a stop</button>
          </div>
          <select id="copyFrom" aria-label="Copy another family's plan" style="margin-bottom:12px"><option value="">Start from another family's plan…</option></select>
          <div class="row"><button class="primary" id="savePlan">Save our plan</button><span id="planMsg" class="muted"></span></div>
        </div>
      </div>
    </details>
  </section>

  <section>
    <h2>Hard dates</h2>
    <div class="card" id="hardList"></div>
  </section>

  <p class="foot">Private trip page. Please don't post it publicly. Editing needs the trip code from Ryan.</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var API_URL = "";

var FAMILIES = [
  {id:"perez", name:"Perez", color:"#D85A30"},
  {id:"gossen", name:"Gossen", color:"#185FA5"},
  {id:"sheffield", name:"Sheffield", color:"#0F6E56"},
  {id:"stuffel", name:"Stuffel", color:"#993556"},
  {id:"yeti", name:"Yeti", color:"#5F5E5A"}
];

var PLACES = {
  "Austin":[30.2672,-97.7431],
  "Wimberley":[29.9974,-98.0986],
  "Rio Grande Village":[29.1830,-102.9581],
  "Chisos Basin":[29.2700,-103.3006],
  "Terlingua":[29.3216,-103.6160],
  "Marathon":[30.2085,-103.2421],
  "Alpine":[30.3585,-103.6610],
  "Marfa":[30.3094,-104.0206],
  "Fort Davis":[30.5888,-103.8946],
  "Guadalupe Mountains":[31.8912,-104.8606],
  "Carlsbad":[32.4207,-104.2288],
  "Roswell":[33.3943,-104.5230],
  "White Sands":[32.7797,-106.1717],
  "Ruidoso":[33.3317,-105.6731],
  "Albuquerque":[35.0844,-106.6504],
  "Santa Fe":[35.6870,-105.9378],
  "Ski Santa Fe":[35.7960,-105.8040],
  "Taos":[36.4072,-105.5731],
  "Golden, CO":[39.7555,-105.2211]
};

function seed(){
  return {
    families:{
      perez:{plan:[
        {id:"p1",place:"Rio Grande Village",lat:29.1830,lng:-102.9581,start:"2026-12-28",end:"2026-12-31",note:"Perez site"},
        {id:"p2",place:"Santa Fe",lat:35.6870,lng:-105.9378,start:"2026-12-31",end:"2027-01-04",note:"Leaving RGV early on the 31st"}
      ]},
      gossen:{plan:[
        {id:"g0",place:"Austin",lat:30.2672,lng:-97.7431,start:"",end:"2026-12-28",note:""},
        {id:"g1",place:"Rio Grande Village",lat:29.1830,lng:-102.9581,start:"2026-12-28",end:"2026-12-31",note:"Perez site"},
        {id:"g2",place:"Santa Fe",lat:35.6870,lng:-105.9378,start:"2026-12-31",end:"2027-01-04",note:"",tentative:true},
        {id:"g3",place:"Golden, CO",lat:39.7555,lng:-105.2211,start:"2027-01-04",end:"",note:"",tentative:true}
      ]},
      sheffield:{plan:[
        {id:"s0",place:"Wimberley",lat:29.9974,lng:-98.0986,start:"",end:"2026-12-28",note:""},
        {id:"s1",place:"Rio Grande Village",lat:29.1830,lng:-102.9581,start:"2026-12-28",end:"2026-12-31",note:"3 nights"},
        {id:"s2",place:"Santa Fe",lat:35.6870,lng:-105.9378,start:"2026-12-31",end:"2027-01-04",note:"Ski Santa Fe most days"},
        {id:"s3",place:"Wimberley",lat:29.9974,lng:-98.0986,start:"2027-01-04",end:"",note:"Drive home"}
      ]},
      stuffel:{plan:[]},
      yeti:{plan:[]}
    },
    hardDates:[
      {id:"h1",date:"2026-12-31",label:"New Year's Eve",by:"gossen"},
      {id:"h2",date:"2027-01-05",label:"School restarts for the Wimberley teens (confirm Jan 4 or 5)",by:"gossen"},
      {id:"h3",date:"2027-01-11",label:"Gossen college classes start",by:"gossen"}
    ],
    ideas:[],
    reservations:[
      {id:"r1",family:"perez",kind:"Campsite",place:"Rio Grande Village",start:"2026-12-28",end:"2026-12-31",detail:"",note:"Gossen van parks here too"}
    ],
    updated:""
  };
}

function applyOp(doc, op){
  if (op.type === "init"){ if (!doc.families){ var s = op.doc; doc.families = s.families; doc.hardDates = s.hardDates; doc.ideas = s.ideas; doc.reservations = s.reservations || []; } return doc; }
  if (!doc.families) doc.families = {};
  if (!doc.hardDates) doc.hardDates = [];
  if (!doc.ideas) doc.ideas = [];
  if (op.type === "setPlan"){ doc.families[op.family] = doc.families[op.family] || {}; doc.families[op.family].plan = op.plan; }
  if (!doc.reservations) doc.reservations = [];
  if (op.type === "addRes"){ doc.reservations.push(op.item); }
  if (op.type === "removeRes"){ doc.reservations = doc.reservations.filter(function(r){ return r.id !== op.id; }); }
  if (op.type === "addHard"){ doc.hardDates.push(op.item); }
  if (op.type === "removeHard"){ doc.hardDates = doc.hardDates.filter(function(h){ return h.id !== op.id; }); }
  if (op.type === "addIdea"){ doc.ideas.push(op.item); }
  if (op.type === "removeIdea"){ doc.ideas = doc.ideas.filter(function(i){ return i.id !== op.id; }); }
  if (op.type === "updateIdea"){ doc.ideas.forEach(function(i){ if (i.id === op.id){ ["status","title","note","date","place","lat","lng"].forEach(function(k){ if (k in op.fields) i[k] = op.fields[k]; }); } }); }
  if (op.type === "vote"){ doc.ideas.forEach(function(i){ if (i.id === op.id){ i.votes = i.votes || {}; if (op.on) i.votes[op.family] = true; else delete i.votes[op.family]; } }); }
  return doc;
}

var LS = {
  get:function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set:function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

var doc = null;
var who = LS.get("bb27-who") || "";
var draft = null;
var picking = null;

function fam(id){ for (var i=0;i<FAMILIES.length;i++) if (FAMILIES[i].id===id) return FAMILIES[i]; return {id:id,name:id,color:"#888"}; }
function uid(p){ return p + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function dayNum(s){ if (!s) return null; var p = s.split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]) / 86400000; }
function fmt(s){ if (!s) return ""; var d = new Date(dayNum(s)*86400000); return d.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"}); }

function setStatus(){
  var el = document.getElementById("status");
  if (API_URL){ el.innerHTML = '<span class="dot" style="background:#1D9E75"></span>'; el.appendChild(document.createTextNode(doc && doc.updated ? "Updated " + new Date(doc.updated).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "Shared")); }
  else { el.innerHTML = '<span class="dot" style="background:#BA7517"></span>Edits stay on this phone for now'; }
}

function loadDoc(){
  if (!API_URL){
    var saved = LS.get("bb27-doc");
    doc = saved ? JSON.parse(saved) : seed();
    cleanDoc(); render(); return Promise.resolve();
  }
  return fetch(API_URL, {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.families){ return send({type:"init", doc:seed()}, true); }
    doc = d; cleanDoc(); render();
  }).catch(function(){ if (!doc){ doc = seed(); render(); } document.getElementById("status").textContent = "Offline: showing last known plan"; });
}

function getCode(){
  var c = LS.get("bb27-code");
  if (!c){ c = prompt("Trip code (ask Ryan):"); if (c){ c = c.trim(); LS.set("bb27-code", c); } }
  return c;
}

function send(op, quiet){
  if (!API_URL){
    applyOp(doc, op); doc.updated = new Date().toISOString();
    LS.set("bb27-doc", JSON.stringify(doc)); render(); return Promise.resolve(true);
  }
  var code = getCode();
  if (!code) return Promise.resolve(false);
  return fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({code:code, op:op})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.error){ if (d.error === "bad code"){ LS.set("bb27-code",""); alert("That trip code didn't work. Try again."); } else if (!quiet) alert("Couldn't save: " + d.error); return false; }
      doc = d; render(); return true;
    })
    .catch(function(){ if (!quiet) alert("Couldn't reach the shared sheet. Check your connection and try again."); return false; });
}

var map, layer, touch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
function initMap(){
  map = L.map("map", {scrollWheelZoom:false, dragging:!touch, tap:false}).setView([32.6,-102.5], 5);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:18, attribution:"&copy; OpenStreetMap"}).addTo(map);
  layer = L.layerGroup().addTo(map);
  if (touch){
    var b = document.getElementById("mapMove"); b.classList.remove("hide");
    b.addEventListener("click", function(){
      if (map.dragging.enabled()){ map.dragging.disable(); b.textContent = "Move map"; }
      else { map.dragging.enable(); b.textContent = "Done moving"; }
    });
  }
  map.on("click", function(e){
    if (!picking) return;
    var s = draft[picking.index];
    s.lat = +e.latlng.lat.toFixed(4); s.lng = +e.latlng.lng.toFixed(4);
    if (!s.place || PLACES[s.place]) s.place = "Custom spot";
    picking = null; document.getElementById("pickhint").classList.add("hide");
    renderEditor(); renderMap(true);
    document.getElementById("planDetails").scrollIntoView({behavior:"smooth", block:"start"});
  });
}

function sortedPlan(plan){
  return (plan || []).slice().sort(function(a,b){ return (dayNum(a.start||a.end)||0) - (dayNum(b.start||b.end)||0); });
}

function renderMap(useDraft){
  layer.clearLayers();
  var bounds = [];
  FAMILIES.forEach(function(f, idx){
    var plan = (useDraft && f.id === who && draft) ? draft : ((doc.families[f.id] || {}).plan || []);
    var pts = [], tent = [], off = (idx - 2) * 0.025;
    sortedPlan(plan).forEach(function(s){
      if (s.lat == null || s.lng == null) return;
      var ll = [s.lat + off, s.lng + off];
      pts.push(ll); tent.push(!!s.tentative); bounds.push(ll);
      L.circleMarker(ll, {radius:6, color:"#fff", weight:2, fillColor:f.color, fillOpacity:1})
        .bindPopup("<b>" + esc(f.name) + "</b><br>" + esc(s.place) + "<br>" + esc([fmt(s.start), fmt(s.end)].filter(Boolean).join(" – ")) + (s.note ? "<br><i>" + esc(s.note) + "</i>" : ""))
        .addTo(layer);
    });
    for (var k = 1; k < pts.length; k++){
      L.polyline([pts[k-1], pts[k]], {color:f.color, weight:3, opacity:.85, dashArray: tent[k] ? "2 7" : null, lineCap:"round"}).addTo(layer);
    }
  });
  (doc.ideas || []).forEach(function(i){
    if (i.lat == null) return;
    var icon = L.divIcon({className:"", html:'<div style="width:16px;height:16px;border:2px dashed #2c2c2a;border-radius:50%;background:#FAC775"></div>', iconSize:[16,16], iconAnchor:[8,8]});
    L.marker([i.lat, i.lng], {icon:icon}).bindPopup("<b>Proposed:</b> " + esc(i.title) + (i.date ? "<br>" + esc(fmt(i.date)) : "") + "<br>from " + esc(fam(i.by).name)).addTo(layer);
    bounds.push([i.lat, i.lng]);
  });
  if (bounds.length && !useDraft) map.fitBounds(bounds, {padding:[24,24]});
  var lg = document.getElementById("legend"); lg.innerHTML = "";
  FAMILIES.forEach(function(f){
    var has = ((doc.families[f.id] || {}).plan || []).length;
    var s = document.createElement("span");
    s.innerHTML = '<span class="sw" style="background:' + f.color + '"></span>';
    s.appendChild(document.createTextNode(f.name + (has ? "" : " · no plan yet")));
    if (!has) s.style.color = "var(--muted)";
    lg.appendChild(s);
  });
  if ((doc.ideas || []).some(function(i){ return i.lat != null; })){
    var pp = document.createElement("span");
    pp.innerHTML = '<span class="sw" style="background:#FAC775;border:2px dashed #2c2c2a;box-sizing:border-box"></span>';
    pp.appendChild(document.createTextNode("Proposed activity")); lg.appendChild(pp);
  }
}

var DRIVE_H = {
  "Austin|Rio Grande Village":7, "Rio Grande Village|Wimberley":6.5, "Austin|Chisos Basin":7, "Chisos Basin|Wimberley":6.5,
  "Austin|Terlingua":7, "Terlingua|Wimberley":6.5, "Rio Grande Village|Santa Fe":9, "Chisos Basin|Santa Fe":9,
  "Santa Fe|Terlingua":9, "Santa Fe|Wimberley":10, "Austin|Santa Fe":10.5, "Golden, CO|Santa Fe":6,
  "Ski Santa Fe|Santa Fe":0.5, "Santa Fe|Taos":1.5, "Albuquerque|Santa Fe":1, "Marfa|Rio Grande Village":2.5,
  "Fort Davis|Rio Grande Village":2.5, "Alpine|Rio Grande Village":2, "Marathon|Rio Grande Village":1.5,
  "Austin|Wimberley":1, "Golden, CO|Wimberley":15, "Austin|Golden, CO":15.5
};
function driveHours(a, b){
  if (!a || !b) return null;
  var k = [a.place, b.place].sort().join("|");
  if (DRIVE_H[k] != null) return DRIVE_H[k];
  if (a.lat == null || b.lat == null) return null;
  var R = 6371, toR = Math.PI / 180;
  var dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  var h = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(a.lat*toR) * Math.cos(b.lat*toR) * Math.sin(dLng/2) * Math.sin(dLng/2);
  var km = 2 * R * Math.asin(Math.sqrt(h));
  return Math.max(0.5, Math.round(km * 1.3 / 95 * 2) / 2);
}
function hrs(h){ return h == null ? "" : "~" + (h < 1 ? Math.round(h*60) + " min" : (h % 1 ? h.toFixed(1) : h) + " hr"); }

function whereOn(plan, d){
  var out = null, sp = sortedPlan(plan);
  sp.forEach(function(s, i){
    var a = s.start ? dayNum(s.start) : null, b = s.end ? dayNum(s.end) : null;
    var prev = i > 0 ? sp[i-1] : null;
    var moved = !!(prev && prev.place !== s.place);
    if (a != null && b != null && d >= a && d < b) out = {place:s.place, tentative:!!s.tentative, drive:(d === a && moved), hours:(d === a && moved ? driveHours(prev, s) : null), note:(d === a ? s.note : "")};
    if (a != null && b == null && d === a) out = {place:s.place, tentative:!!s.tentative, drive:moved, hours:moved ? driveHours(prev, s) : null, note:s.note, last:true};
  });

function setDay(family, d, placeName, dEnd, tentative){

  var plan = normalizePlan(JSON.parse(JSON.stringify(((doc.families[family] || {}).plan) || [])));
  var fin = plan.filter(function(s){ return s.start && !s.end; })[0];

  }

}

function render(){
  setStatus(); renderMap(false); renderDays(); renderEditor(); renderHard();
}

document.addEventListener("DOMContentLoaded", function(){
  var sel = document.getElementById("who");
  FAMILIES.forEach(function(f){ var o = document.createElement("option"); o.value = f.id; o.textContent = f.name; sel.appendChild(o); });
  sel.value = who;
  sel.addEventListener("change", function(){ who = sel.value; LS.set("bb27-who", who); draft = null; render(); });
  initMap();

  document.getElementById("pickcancel").addEventListener("click", function(){ picking = null; document.getElementById("pickhint").classList.add("hide"); });
  document.getElementById("addStop").addEventListener("click", function(){
    var last = draft[draft.length - 1];
    draft.push({id:uid("s"), place:"Santa Fe", lat:PLACES["Santa Fe"][0], lng:PLACES["Santa Fe"][1], start:last ? (last.end || "") : "", end:"", note:""});
    renderEditor(); renderMap(true);
  });
  document.getElementById("copyFrom").addEventListener("change", function(e){
    var from = e.target.value; if (!from) return;
    if (draft.length && !confirm("Replace your stops with the " + fam(from).name + " plan? You can change it before saving.")){ e.target.value = ""; return; }
    draft = JSON.parse(JSON.stringify(doc.families[from].plan)).map(function(s){ s.id = uid("s"); s.note = ""; return s; });
    renderEditor(); renderMap(true);
  });
  document.getElementById("savePlan").addEventListener("click", function(){
    var msg = document.getElementById("planMsg");
    for (var i = 0; i < draft.length; i++){
      var s = draft[i];
      if (!s.start && !s.end){ msg.textContent = "Each stop needs an arrive or leave date."; return; }
      if (s.start && s.end && dayNum(s.end) < dayNum(s.start)){ msg.textContent = s.place + ": leave date is before arrive date."; return; }
    }
    msg.textContent = "Saving…";
    send({type:"setPlan", family:who, plan:draft}).then(function(ok){ msg.textContent = ok ? "Saved." : ""; if (ok) draft = null; render(); });
  });
  loadDoc();
  if (API_URL) setInterval(function(){ if (!picking) loadDoc(); }, 60000);
});
</script>
</body>
</html>
